[project]
name = "ics-manager"
version = "0.1.0"
description = "Skill utilities for inspecting and editing ICS calendar files"
requires-python = ">=3.10"
dependencies = [
    "icalendar==7.1.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]