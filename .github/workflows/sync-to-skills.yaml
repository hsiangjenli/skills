name: Sync from .agents/skills to skills

on:
  push:
    paths:
      - ".agents/skills/**"
      - ".github/workflows/**"
      - "scripts/**"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync skills from specified source
        run: uv run scripts/sync_to_skills.py --source hsiangjenli/skills

      - name: Update README.md
        run: uv run scripts/update_readme.py --source hsiangjenli/skills

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add skills/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(auto): update custom skills from .agents/skills"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
